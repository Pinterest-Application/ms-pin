logging:
  level:
    org.springframework: DEBUG

spring:
  application:
    name: ms-pin
  config:
    import: "classpath:application-vault.yml,vault://"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${db-url}
    username: ${db-username}
    password: ${db-password}
  liquibase:
    enabled: true
    change-log: classpath:migration/changelog-master.xml
    default-schema: ms_pin
    liquibase-schema: ms_pin
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ms_pin
        ddl-auto: none
    generate-ddl: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer-uri}
  kafka:
    bootstrap-servers: coolify.tail1270a7.ts.net:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
    topics:
      pin-image-process: pin-image-process-topic

server:
  port: 0

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: ${eureka-server}

media:
  url:
    base: ${seaweedfs-media-url}

management:
  endpoints:
    web:
      exposure:
        include: health,info
